<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glazes de Overwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== COLORES Y FUENTES (edita aquí para cambiar el estilo global) ===== */
:root{--bg:#070707;--panel:#141414;--panel2:#1f1f1f;--line:#333;--ow:#f99e1a;--ow2:#ff6a00;--txt:#f5f5f5;--mut:#a0a0a0;
--gold:#ffc83d;--silver:#d5dde8;--bronze:#d98a4e;
--cp:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
--f1:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f2:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(800px 420px at 88% -8%,#f99e1a30,transparent),url("data:image/svg+xml,%3Csvg width='28' height='49' viewBox='0 0 28 49' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9zM0 15l12.98-7.5V0h-2v6.35L0 12.69v2.3zm0 18.5L12.98 41v8h-2v-6.85L0 35.81v-2.3zM15 0v7.5L27.99 15H28v-2.31h-.01L17 6.35V0h-2zm0 49v-8l12.99-7.5H28v2.31h-.01L17 42.15V49h-2z' fill='%23f99e1a' fill-opacity='.06'/%3E%3C/svg%3E"),var(--bg);background-attachment:fixed;color:var(--txt);font:600 18px/1.3 var(--f2);min-height:100vh;padding:0 14px 56px}
a{color:inherit}a:focus-visible{outline:2px solid var(--ow);outline-offset:3px}
.wrap{max-width:1020px;margin:0 auto}
header{position:relative;padding:44px 0 28px;border-bottom:1px solid var(--line)}
header>:not(.art):not(.logo){position:relative;z-index:1}
header::after{content:"";position:absolute;right:0;bottom:-1px;width:40%;height:4px;background:repeating-linear-gradient(115deg,var(--ow2) 0 10px,transparent 10px 18px)}
h1{font:900 clamp(46px,10vw,98px)/.92 var(--f1);text-transform:uppercase;font-style:italic;transform:skewX(-8deg);transform-origin:left;text-shadow:5px 5px 0 #f99e1a66}
h1::after{content:"";display:block;height:9px;width:min(300px,62%);background:var(--ow);margin-top:12px;transform:skewX(-30deg)}
.by{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:18px;color:var(--mut);font-size:21px}
.by a{text-decoration:none;color:var(--txt);display:inline-flex;gap:8px;align-items:center}
.by svg{width:22px;height:22px;fill:#9146ff}
.by .lt{padding:3px 18px;background:var(--ow);color:#0a0a0a;font-weight:700;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
h2{display:block;width:fit-content;font:900 clamp(26px,4.4vw,38px)/1 var(--f1);text-transform:uppercase;font-style:italic;margin:44px 0 14px;padding:6px 44px 6px 16px;background:var(--ow);color:#0a0a0a;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%)}
h3{font:900 24px var(--f1);text-transform:uppercase;font-style:italic;margin:28px 0 8px;color:var(--ow);border-bottom:1px solid var(--line);padding-bottom:4px}
/* ===== ARTE DE HÉROES (images/heroes/art/) ===== */
.logo{position:absolute;right:0;top:50%;transform:translateY(-50%);max-width:45%;object-fit:contain;object-position:right center;pointer-events:none;z-index:0}
.art{position:absolute;right:0;bottom:0;height:125%;max-width:55%;object-fit:contain;object-position:right bottom;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to left,#000 60%,transparent);mask-image:linear-gradient(to left,#000 60%,transparent)}
/* ===== FILAS (tablas) ===== */
.tbl{overflow-x:auto;padding:8px 8px 4px}
.rw{min-width:760px;margin-bottom:7px}
.row{display:grid;grid-template-columns:var(--g,60px minmax(130px,1fr) 165px 105px 160px 125px);gap:10px;align-items:center;min-width:760px;padding:10px 20px;position:relative;isolation:isolate;clip-path:var(--cp);background:var(--ol,transparent)}
.row::before{content:"";position:absolute;inset:var(--o,0);z-index:-1;clip-path:var(--cp);background:linear-gradient(90deg,var(--c,var(--line)) 0 6px,var(--panel) 6px)}
.row.np{--g:minmax(130px,1fr) 165px 105px 160px 125px}
.row.sc{--g:105px minmax(130px,1fr) 160px 125px}
.row.head{margin-bottom:7px;color:#0a0a0a;font:900 17px var(--f1);text-transform:uppercase;letter-spacing:.08em}
.row.head::before{background:var(--ow)}
.pos{font:900 32px var(--f1);font-style:italic;color:var(--mut)}
.pt{font:900 29px var(--f1);font-style:italic}
.dt{color:var(--mut)}
.nm{font-size:22px;font-weight:700;text-decoration:none;overflow-wrap:anywhere}.nm:hover{color:var(--ow)}
.cl{display:inline-flex;align-items:center;gap:9px}
.r1,.gold{filter:drop-shadow(0 0 9px #ffc83dd0)}.r1 .row,.gold .row{--ol:var(--gold);--o:2px}.r1 .pos,.gold .pt{color:var(--gold)}
.r2{filter:drop-shadow(0 0 9px #d5dde8b0)}.r2 .row{--ol:var(--silver);--o:2px}.r2 .pos{color:var(--silver)}
.r3{filter:drop-shadow(0 0 9px #d98a4ec8)}.r3 .row{--ol:var(--bronze);--o:2px}.r3 .pos{color:var(--bronze)}
.ic{width:40px;height:40px;object-fit:contain}
.ph{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c,var(--line));color:#0a0a0a;font:900 20px var(--f1);flex:none}
.av{width:112px;height:112px;object-fit:cover;border-radius:50%;border:4px solid var(--c,var(--ow));background:var(--panel2);position:relative;z-index:1}.ph.av{font-size:58px}
.empty{padding:22px;color:var(--mut)}
/* ===== ESTADÍSTICAS Y TARJETAS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border-left:5px solid var(--ow);clip-path:var(--cp);padding:16px 20px}
.card>:not(.art){position:relative;z-index:1}
.card .art{height:100%;opacity:.5;max-width:50%}
.card.wide{grid-column:1/-1}
.card small{display:block;color:var(--mut);font-size:17px;margin-bottom:6px}
.big{font:900 46px/1 var(--f1);font-style:italic}
.ch{width:100%;height:auto;margin-top:8px}
.card .ic,.card .ph:not(.av){width:64px;height:64px}
/* ===== PERFIL ===== */
.back{display:inline-block;margin:26px 0 8px;color:var(--ow);text-decoration:none;font:900 20px var(--f1);text-transform:uppercase}
.pf{display:flex;flex-wrap:wrap;gap:20px 26px;align-items:center;min-height:190px;border-left-color:var(--c)}
.pf .art{opacity:.4;max-width:45%}
.pf h2{margin:0 0 8px;padding:0;background:none;color:var(--txt);clip-path:none;font-size:44px}
.tw{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:#c9a8ff}.tw svg{width:20px;height:20px;fill:#9146ff}
.kv{display:flex;gap:26px;align-items:center;margin-left:auto}.kv b{font:900 36px var(--f1);font-style:italic;display:block}.kv small{color:var(--mut)}
.hb{display:grid;grid-template-columns:175px 1fr 44px;gap:10px;align-items:center;margin:6px 0}
.hb i{height:10px;background:var(--ow);transform:skewX(-20deg)}
@media(max-width:700px){.art,.logo{opacity:.3}.kv{margin-left:0}.hb{grid-template-columns:140px 1fr 40px}}
@media(prefers-reduced-motion:no-preference){#perfil:not([hidden]){animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateX(18px)}}}
/* ===== PESTAÑAS, TARJETAS DE PARTICIPANTES Y FAQ ===== */
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
nav a{padding:9px 30px 9px 26px;background:var(--panel2);color:var(--txt);text-decoration:none;font:900 20px var(--f1);text-transform:uppercase;font-style:italic;letter-spacing:.04em;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
nav a:hover{background:#2e2e2e}nav a.on{background:var(--ow);color:#0a0a0a}
.note{color:var(--mut);margin:6px 4px 0}.note a{color:var(--ow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-left:5px solid var(--c,var(--ow));clip-path:var(--cp);text-decoration:none}
.pc:hover{background:var(--panel2)}.pc:hover b{color:var(--ow)}
.pc b{font-size:23px;overflow-wrap:anywhere}.pc small{display:block;color:var(--mut)}
.av2{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--c,var(--ow));background:var(--panel2);flex:none}.ph.av2{font-size:30px}
.fq{background:var(--panel);border-left:5px solid var(--ow);clip-path:var(--cp);margin-bottom:10px}
.fq summary{cursor:pointer;padding:14px 20px;font:900 25px var(--f1);text-transform:uppercase;font-style:italic;list-style:none}
.fq summary::-webkit-details-marker{display:none}.fq summary::after{content:"+";float:right;color:var(--ow)}.fq[open] summary::after{content:"–"}
.fq div{padding:0 20px 18px;white-space:pre-line;color:#e0e0e0}.fq a{color:var(--ow)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="titulo">Glazes de Overwatch</h1>
  <div class="by"><span>Creado por</span><a id="tw" target="_blank" rel="noopener"></a><a id="lt" class="lt" target="_blank" rel="noopener" hidden>Linktree</a></div>
</header>
<nav id="nav"><a href="#/" data-t="home">Leaderboard</a><a href="#/participantes" data-t="part">Todos los participantes</a><a href="#/faq" data-t="faq">Preguntas frecuentes</a></nav>

<main id="home">
  <h2>Leaderboard</h2><div class="tbl" id="board"></div>
  <h2>Últimas puntuaciones</h2><div class="tbl" id="latest"></div>
  <h2>Estadísticas generales</h2><div class="stats" id="stats"></div>
</main>
<main id="part" hidden></main>
<main id="faq" hidden></main>
<main id="perfil" hidden></main>
</div>

<script src="datos.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const key=n=>n.trim().toLowerCase();
const safe=u=>/^https?:\/\//.test(u||'')?esc(u):'';
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
const rankOf=p=>RANGOS.reduce((r,x)=>p>=x.min?x:r,RANGOS[0]);
const TW='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.43l-3 3v-3H6.857V1.714h13.714Z"/></svg>';

/* Si una imagen no existe, se muestra un círculo con la inicial */
document.addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;if(i.dataset.hide){i.remove();return}
  const s=document.createElement('span');s.className='ph '+i.className;s.textContent=(i.alt||'?')[0];
  if(i.dataset.c)s.style.setProperty('--c',i.dataset.c);i.replaceWith(s)},true);

const EXT=(CONFIG.formatoImagen||'webp').replace('.','');
const img=(src,n,cls,c)=>`<img class="${cls}" src="${src}" alt="${esc(n)}" title="${esc(n)}"${c?` data-c="${c}"`:''}>`;
const heroImg=(h,cls='ic')=>img(`images/heroes/${slug(h)}.${EXT}`,h,cls);
const rankImg=(r,cls='ic')=>img(`images/ranks/${slug(r.n)}.${EXT}`,r.n,cls,r.c);
const artImg=h=>`<img class="art" data-hide src="images/heroes/art/${slug(h)}.${EXT}" alt="">`;
const heroCell=h=>`<span class="cl">${heroImg(h)}${esc(h)}</span>`;
const rankCell=r=>`<span class="cl">${rankImg(r)}<b style="color:${r.c}">${r.n}</b></span>`;
const link=n=>`<a class="nm" href="#/jugador/${encodeURIComponent(n)}">${esc(n)}</a>`;
const head=(pos)=>`<div class="row head${pos?'':' np'}">${pos?'<span>Posición</span>':''}<span>Jugador</span><span>Héroe</span><span>Puntuación</span><span>Rango</span><span>Fecha</span></div>`;
const row=(s,pos)=>{const r=rankOf(s.puntos);return `<div class="rw${pos&&pos<4?' r'+pos:''}"><div class="row${pos?'':' np'}" style="--c:${r.c}">${pos?`<span class="pos">${pos}</span>`:''}${link(s.jugador)}${heroCell(s.heroe)}<span class="pt">${s.puntos.toLocaleString('es-MX')}</span>${rankCell(r)}<span class="dt">${fmt(s.fecha)}</span></div></div>`};

/* ===== Procesar datos ===== */
const S=PUNTUACIONES.map((s,i)=>({...s,i}));
const players={};
S.forEach(s=>{const k=key(s.jugador);(players[k]=players[k]||{name:s.jugador.trim(),sc:[]}).sc.push(s)});
Object.entries(players).forEach(([k,p])=>{
  p.sc.sort((a,b)=>b.puntos-a.puntos||a.fecha.localeCompare(b.fecha));
  p.best=p.sc[0];p.avg=Math.round(p.sc.reduce((a,s)=>a+s.puntos,0)/p.sc.length);
  const c={};p.sc.forEach(s=>c[s.heroe]=(c[s.heroe]||0)+1);
  p.heroes=Object.entries(c).sort((a,b)=>b[1]-a[1]);p.main=p.heroes[0][0];
  const f=Object.keys(JUGADORES).find(n=>key(n)===k);p.twitch=f?JUGADORES[f].twitch:'';
});
const count=a=>{const c={};a.forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])};

function chart(){
  const o=[...S].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.i-b.i);let t=0;
  const v=o.map((s,i)=>(t+=s.puntos)/(i+1)),W=600,H=170,P=30,mn=Math.min(...v),mx=Math.max(...v),sp=(mx-mn)||1;
  const X=i=>P+(v.length>1?i*(W-2*P)/(v.length-1):(W-2*P)/2),Y=x=>H-P-(x-mn)/sp*(H-2*P);
  const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del promedio total"><polygon points="${X(0)},${H-P} ${pts} ${X(v.length-1)},${H-P}" fill="#f99e1a24"/><polyline points="${pts}" fill="none" stroke="#f99e1a" stroke-width="3"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="#fff"><title>${Math.round(x)}</title></circle>`).join('')}<text x="${P}" y="14" fill="#a0a0a0" font-size="14">${Math.round(mx)}</text><text x="${P}" y="${H-8}" fill="#a0a0a0" font-size="14">${Math.round(mn)}</text></svg>`;
}

function home(){
  if(!S.length){$('#board').innerHTML=$('#latest').innerHTML=$('#stats').innerHTML='<p class="empty">Aún no hay puntuaciones registradas.</p>';return}
  const b=Object.values(players).map(p=>p.best).sort((a,b)=>b.puntos-a.puntos||a.fecha.localeCompare(b.fecha)||a.i-b.i);
  $('#board').innerHTML=head(1)+(N=>b.slice(0,N).map((s,i)=>row(s,i+1)).join('')+`<p class="note">Mostrando el top ${Math.min(N,b.length)} de ${b.length} participantes · <a href="#/participantes">Ver a todos</a></p>`)(CONFIG.topLeaderboard||10);
  const l=[...S].sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.i-a.i).slice(0,CONFIG.ultimasMostrar||15);
  $('#latest').innerHTML=head(0)+l.map(s=>row(s)).join('');
  const [h,n]=count(S.map(s=>s.heroe))[0],avg=Math.round(S.reduce((a,s)=>a+s.puntos,0)/S.length),r=rankOf(avg);
  $('#stats').innerHTML=`<div class="card">${artImg(h)}<small>Héroe más jugado</small><div class="cl">${heroImg(h)}<div><div class="big">${esc(h)}</div><small>${n} ${n==1?'vez':'veces'}</small></div></div></div>
  <div class="card" style="border-left-color:${r.c}"><small>Rango promedio total</small><div class="cl">${rankImg(r)}<div class="big" style="color:${r.c}">${r.n}</div></div></div>
  <div class="card wide"><small>Promedio total de puntuaciones</small><div class="big">${avg.toLocaleString('es-MX')}</div>${chart()}</div>`;
}

function perfil(name){
  const p=players[key(name)];if(!p)return false;
  const r=rankOf(p.avg),mx=p.heroes[0][1];
  $('#perfil').innerHTML=`<a class="back" href="#/">‹ Volver a la tabla</a>
  <div class="card pf" style="--c:${rankOf(p.best.puntos).c}">${artImg(p.main)}${heroImg(p.main,'av')}
    <div><h2>${esc(p.name)}</h2>${safe(p.twitch)?`<a class="tw" href="${safe(p.twitch)}" target="_blank" rel="noopener">${TW}Canal de Twitch</a>`:''}</div>
    <div class="kv"><div><small>Promedio</small><b>${p.avg.toLocaleString('es-MX')}</b></div>${rankCell(r)}<div><small>Partidas</small><b>${p.sc.length}</b></div></div></div>
  <h3>Héroes más usados</h3>${p.heroes.slice(0,5).map(([h,n])=>`<div class="hb"><span class="cl">${heroImg(h)}${esc(h)}</span><i style="width:${n/mx*100}%"></i><b>${n}×</b></div>`).join('')}
  <h3>Puntuaciones históricas</h3><div class="tbl"><div class="row head sc"><span>Puntuación</span><span>Héroe</span><span>Rango</span><span>Fecha</span></div>
  ${p.sc.map((s,i)=>{const k=rankOf(s.puntos);return `<div class="rw${i?'':' gold'}"><div class="row sc" style="--c:${k.c}"><span class="pt">${s.puntos.toLocaleString('es-MX')}</span>${heroCell(s.heroe)}${rankCell(k)}<span class="dt">${fmt(s.fecha)}</span></div></div>`}).join('')}</div>`;
  return true;
}

function participantes(){
  const a=Object.values(players).sort((x,y)=>x.name.localeCompare(y.name,'es',{sensitivity:'base',numeric:true}));
  $('#part').innerHTML=`<h2>Todos los participantes</h2><p class="note" style="margin:0 0 12px">${a.length} participantes · orden alfabético</p><div class="grid">${a.map(p=>`<a class="pc" href="#/jugador/${encodeURIComponent(p.name)}" style="--c:${rankOf(p.best.puntos).c}"><div><b>${esc(p.name)}</b><small>Héroe más jugado: ${esc(p.main)}</small></div>${heroImg(p.main,'av2')}</a>`).join('')}</div>`;
}

function faq(){
  const q=typeof FAQ!=='undefined'?FAQ:[];
  $('#faq').innerHTML='<h2>Preguntas frecuentes</h2>'+q.map(x=>`<details class="fq"><summary>${esc(x.p)}</summary><div>${esc(x.r).replace(/https?:\/\/[^\s<]*[^\s<.,;:!?)]/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}</div></details>`).join('');
}

function route(){
  const h=location.hash,m=h.match(/^#\/jugador\/(.+)$/);
  let t=h==='#/participantes'?'part':h==='#/faq'?'faq':'home';
  if(m)t=perfil(decodeURIComponent(m[1]))?'perfil':'home';
  ['home','part','faq','perfil'].forEach(id=>$('#'+id).hidden=id!==t);
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  scrollTo(0,0);
}

document.title=CONFIG.titulo;$('#titulo').textContent=CONFIG.titulo;
$('#tw').href=safe(CONFIG.twitchUrl);$('#tw').innerHTML=TW+'Paindej0_';
if(safe(CONFIG.linktree)){$('#lt').href=safe(CONFIG.linktree);$('#lt').hidden=false}
if(CONFIG.logoEncabezado)$('header').insertAdjacentHTML('afterbegin',`<img class="logo" data-hide src="${esc(CONFIG.logoEncabezado)}" style="height:${+CONFIG.logoAlto||150}px" alt="">`);
home();participantes();faq();route();addEventListener('hashchange',route);
</script>
</body>
</html>
